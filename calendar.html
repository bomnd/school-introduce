<!doctype html>
<html lang="zh-CN">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<style type="text/css">
		body {
			margin: 0;
			padding: 0;
			font-family: Arial, sans-serif;
			color: #000000;
			background-color: #FFFFFF;
		}
		
		.container {
			width: 100%;
			max-width: 1200px;
			margin: 0 auto;
			overflow-x: auto;
		}
		
		table {
			width: 100%;
			border-collapse: collapse;
			margin-bottom: 20px;
		}
		
		/* 导航表格样式 */
		.nav-table {
			width: 100%;
			background-color: #131840;
		}
		
		.nav-table td {
			text-align: center;
			padding: 15px 5px;
		}
		
		/* 内容表格样式 */
		.content-table td {
			padding: 15px;
			vertical-align: top;
			border: 1px solid #ddd;
		}
		
		/* 图片响应式 */
		img {
			max-width: 100%;
			height: auto;
			display: block;
		}
		
		/* 链接样式 */
		a:link, a:visited {
			color: #FFFFFF;
			text-decoration: none;
		}
		
		a:hover {
			text-decoration: underline;
		}
		
		/* 页脚样式 */
		.footer {
			background-color: #003366;
			color: #FFFFFF;
		}
		
		.footer a {
			color: #FFFFFF;
		}
		
		.footer td {
			padding: 20px 15px;
			vertical-align: top;
		}
		
		/* 响应式调整 */
		@media screen and (max-width: 768px) {
			.nav-table td {
				display: block;
				width: 100%;
				padding: 10px;
			}
			
			.content-table td {
				display: block;
				width: 100%;
			}
			
			.footer td {
				display: block;
				width: 100%;
				text-align: center;
			}
			
			/* 隐藏音频控件在小屏幕上 */
			audio {
				width: 100%;
			}
		}
		
		/* 对于非常小的屏幕 */
		@media screen and (max-width: 480px) {
			.nav-table td {
				font-size: 14px;
				padding: 8px;
			}
			
			.content-table td {
				padding: 10px;
			}
			
			.footer td {
				padding: 15px 10px;
			}
			
			h3 {
				font-size: 18px;
			}
			
			p {
				font-size: 14px;
			}
		}
	</style>
	<link href="webfonts/__/stylesheet.css" rel="stylesheet" type="text/css">
